    para que las fuentes carguen más rápido -->

  <!-- Descarga las fuentes: Playfair Display (pesos 500 y 700) y

    fuente de reserva mientras carga la definitiva, evitando texto invisible -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet">
